name: application
description: "boxcards.shop customer app."
publish_to: 'none'

# build-name is the Android versionName / iOS CFBundleShortVersionString,
# build-number the versionCode / CFBundleVersion.
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  biometric_signature: 13.3.0
  decimal: ^3.2.6
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.4
  intl: ^0.20.3
  json_annotation: ^4.12.0
  riverpod_annotation: ^4.0.8
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  riverpod_generator: ^4.0.10
  riverpod_lint: ^3.2.0
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/brand/

  # OFL fonts from github.com/google/fonts (sources in README.md). Changa and Readex Pro are
  # variable fonts: weights are selected with FontVariation in core/theme/tokens/typography.dart.
  fonts:
    - family: Changa
      fonts:
        - asset: assets/fonts/changa/Changa-Variable.ttf
    - family: ReadexPro
      fonts:
        - asset: assets/fonts/readex_pro/ReadexPro-Variable.ttf
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/ibm_plex_mono/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/ibm_plex_mono/IBMPlexMono-Medium.ttf
          weight: 500
