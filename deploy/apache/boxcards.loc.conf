# Local Apache vhost for boxcards.shop (this repository). Installed by deploy/setup-local-sudo.sh.
# Storefront at http://boxcards.loc, admin at http://boxcards.loc/admin (admin.boxcards.loc is kept as an alias).
<VirtualHost *:80>
    ServerName boxcards.loc
    ServerAlias admin.boxcards.loc

    DocumentRoot /var/www/enterprise-gaming-digital-store/backend/public

    <Directory /var/www/enterprise-gaming-digital-store/backend/public>
        AllowOverride All
        Require all granted
    </Directory>

    # admin exports and media uploads
    LimitRequestBody 33554432

    ErrorLog ${APACHE_LOG_DIR}/boxcards.loc_error.log
    CustomLog ${APACHE_LOG_DIR}/boxcards.loc_access.log combined
</VirtualHost>
